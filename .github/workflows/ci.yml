name: CI

on:
  push:
    tags-ignore:
      - '**'
  pull_request:

jobs:
  buildsh:
    env:
        DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    strategy:
      matrix:
        mode: [carthage, spm, spm-texture-basic, spm-texture-iglistkit, spm-app-iglistkit]
        include:
          - mode: carthage
            name: Verify that Carthage works
          - mode: spm
            name: Verify that Swift Package Manager works
          - mode: spm-texture-basic
            name: Test SPM with default traits (AsyncDisplayKit)
          - mode: spm-texture-iglistkit
            name: Test SPM with IGListKit trait
          - mode: spm-app-iglistkit
            name: Test SPM iOS app with IGListKit (local package wrapper)
    name: ${{ matrix.name }}
    runs-on: macos-15
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@v4
    - name: Run build script
      run: ./build.sh ${{ matrix.mode }}
